<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A fast, simple calculator for everyday math." />
    <title>ClearCalc | Simple calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Everyday arithmetic</p>
        <h1 id="page-title">Clear<span>Calc</span></h1>
        <p class="intro-copy">A calm little calculator for the numbers in front of you.</p>
        <div class="rule" aria-hidden="true"></div>
        <p class="tip"><kbd>Enter</kbd> to solve <span aria-hidden="true">·</span> <kbd>Esc</kbd> to clear</p>
      </section>

      <section class="calculator" aria-label="Calculator">
        <div class="display-wrap">
          <p class="display-expression" id="expression" aria-live="polite">Ready when you are</p>
          <output class="display-value" id="display" aria-label="Calculator display">0</output>
        </div>

        <div class="keypad">
          <button class="key key-muted" data-action="clear" type="button">AC</button>
          <button class="key key-muted" data-action="sign" type="button">+/-</button>
          <button class="key key-muted" data-action="percent" type="button">%</button>
          <button class="key key-operator" data-value="/" type="button" aria-label="Divide">÷</button>

          <button class="key" data-value="7" type="button">7</button>
          <button class="key" data-value="8" type="button">8</button>
          <button class="key" data-value="9" type="button">9</button>
          <button class="key key-operator" data-value="*" type="button" aria-label="Multiply">×</button>

          <button class="key" data-value="4" type="button">4</button>
          <button class="key" data-value="5" type="button">5</button>
          <button class="key" data-value="6" type="button">6</button>
          <button class="key key-operator" data-value="-" type="button" aria-label="Subtract">−</button>

          <button class="key" data-value="1" type="button">1</button>
          <button class="key" data-value="2" type="button">2</button>
          <button class="key" data-value="3" type="button">3</button>
          <button class="key key-operator" data-value="+" type="button" aria-label="Add">+</button>

          <button class="key key-zero" data-value="0" type="button">0</button>
          <button class="key" data-action="decimal" type="button">.</button>
          <button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
